name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        # يقوم هذا الجزء التلقائي بفحص الملفات وإصلاح ترميز الويندوز وتوليد الملفات الناقصة وبناء التطبيق
        run: |
          echo "=== CLI Diagnostics ==="
          echo "Current working directory:"
          pwd
          echo "Listing files in the workspace (depth 3):"
          find . -maxdepth 3 -not -path '*/.*'
          
          echo "=== Detecting Project Directory ==="
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -not -path "*/.gradle/*" -not -path "*/app/*" | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ] || [ "$PROJECT_DIR" = "." ]; then
            PROJECT_DIR="."
          fi
          echo "Detected project directory: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          echo "=== Checking Gradle Wrapper ==="
          if [ ! -f "./gradlew" ]; then
            echo "gradlew is missing! Attempting to generate it..."
            gradle wrapper --gradle-version 8.7 || echo "Failed to generate wrapper using pre-installed gradle, will try direct build."
          fi
          
          if [ -f "./gradlew" ]; then
            echo "gradlew found. Ensuring correct line endings and execution permissions..."
            # إصلاح مشكلة ملفات ويندوز تلقائياً (\r) التي تسبب الفشل في لينكس
            tr -d '\r' < ./gradlew > ./gradlew.tmp && mv ./gradlew.tmp ./gradlew
            chmod +x ./gradlew
            echo "Running ./gradlew assembleDebug..."
            ./gradlew assembleDebug --stacktrace
          else
            echo "gradlew still not found. Attempting to build using system gradle..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
