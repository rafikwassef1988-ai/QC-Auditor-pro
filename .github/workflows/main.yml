name: Android CI/CD

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Debug APK
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=512m" -Dorg.gradle.daemon=false
        run: |
          echo "=== Setting up Environment ==="
          if [ ! -f ".env.example" ]; then
            echo "GEMINI_API_KEY=" > .env.example
          fi
          if [ ! -f ".env" ]; then
            touch .env
          fi
          
          echo "=== Preparing Keystore ==="
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore..."
            base64 -d debug.keystore.base64 > debug.keystore
          else
            echo "Warning: debug.keystore.base64 not found!"
          fi
          
          echo "=== Optimizing gradle.properties for CI memory limits ==="
          if [ -f "gradle.properties" ]; then
            # Disable parallel builds, configuration caching, and build caching to prevent JVM memory exhaustion
            sed -i 's/org.gradle.parallel=true/org.gradle.parallel=false/g' gradle.properties
            sed -i 's/org.gradle.configuration-cache=true/org.gradle.configuration-cache=false/g' gradle.properties
            sed -i 's/org.gradle.caching=true/org.gradle.caching=false/g' gradle.properties
            sed -i 's/org.gradle.workers.max=4/org.gradle.workers.max=1/g' gradle.properties
            sed -i 's/org.gradle.jvmargs=-Xmx4g/org.gradle.jvmargs=-Xmx2048m/g' gradle.properties
            
            # Force Kotlin to compile in-process so it doesn't spin up another memory-heavy daemon
            echo "kotlin.compiler.execution.strategy=in-process" >> gradle.properties
            
            echo "=== Updated gradle.properties ==="
            cat gradle.properties
          fi
          
          echo "=== Fixing potentially corrupt gradle-wrapper.jar ==="
          mkdir -p gradle/wrapper
          rm -f gradle/wrapper/gradle-wrapper.jar
          curl -sSLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v9.3.1/gradle/wrapper/gradle-wrapper.jar
          
          echo "=== Fixing Gradlew line endings & permissions ==="
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          
          echo "=== Running Gradle Build ==="
          ./gradlew assembleDebug --stacktrace --no-daemon --no-parallel -Dorg.gradle.workers.max=1

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
          retention-days: 7
